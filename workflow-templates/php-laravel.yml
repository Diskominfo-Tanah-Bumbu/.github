name: PHP Laravel CI

on:
  push:
    branches: [$default-branch, production]
  pull_request:
    branches: [$default-branch, production]

jobs:
  quality-check:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, json, bcmath, pdo_mysql
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress || true

      - name: Run Pint (code style)
        run: vendor/bin/pint --test || true

      - name: Run tests
        run: vendor/bin/phpunit --no-coverage || true
